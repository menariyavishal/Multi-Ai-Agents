version: '3.8'

services:
  # MongoDB Database (Optional - used if MONGODB_URI is not pointing to MongoDB Atlas)
  mongodb:
    image: mongo:7.0
    container_name: multi_ai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=multi_ai_agents
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Flask + Gunicorn 5-Agent Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: multi_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - PORT=8000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/multi_ai_agents}
      - MONGODB_DB_NAME=multi_ai_agents
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-prod}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY:-}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID:-}
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy

  # React + Vite Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: multi_ai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_data:
  backend_logs:
